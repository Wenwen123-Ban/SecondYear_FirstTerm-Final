<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .product { max-width: 520px; padding: 18px; }
    .product h1 { font-size: 24px; font-weight: 400; }
    .price { font-size: 22px; }
    button { padding: 10px 16px; border: 2px solid #111; font-size: 18px; cursor: pointer; }
    .add { background: #ffeb00; }
    .buy { background: #ff9800; }
  </style>
</head>
<body>
  <!-- 4i: Product layout recreated from the reference. -->
  <main class="product">
    <h1>Adults Plain Cotton T-shirt</h1>
    <p class="price">Price: $7.99</p>
    <!-- 4j: Clicking each button performs its requested action. -->
    <button class="add" type="button" id="addButton">Add to cart</button>
    <button class="buy" type="button" id="buyButton">Buy now</button>
  </main>
  <script>
    document.getElementById("addButton").addEventListener("click", () => alert("Added"));
    document.getElementById("buyButton").addEventListener("click", () => {
      console.log("Loading...");
      alert("Purchased");
    });
  </script>
</body>
</html>
