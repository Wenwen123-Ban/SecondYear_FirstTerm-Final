<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson 7 - Temperature Conversion</title>
</head>
<body>
  <h1>Temperature Conversion</h1>
  <p>Open the browser console to see exercises 7d-7f.</p>
  <script>
    // 7d: Celsius to Fahrenheit.
    function convertToFahrenheit(celsius) {
      return (celsius * 9 / 5) + 32;
    }

    // 7e: Fahrenheit to Celsius.
    function convertToCelsius(fahrenheit) {
      return (fahrenheit - 32) * 5 / 9;
    }

    // 7f: Convert either way and return the value with its unit.
    function convertTemperature(degrees, unit) {
      if (unit === "C") {
        return convertToFahrenheit(degrees) + "F";
      }
      if (unit === "F") {
        return convertToCelsius(degrees) + "C";
      }
      return "Invalid unit: " + unit;
    }

    console.log("7d:", convertToFahrenheit(25)); // 77
    console.log("7e:", convertToCelsius(86)); // 30
    console.log("7f:", convertTemperature(25, "C")); // 77F
    console.log("7f:", convertTemperature(86, "F")); // 30C
  </script>
</body>
</html>
