<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    .calculator { width: 280px; }
    #screen { display: block; min-height: 2em; padding: 10px; border: 1px solid #999; text-align: right; font-size: 1.6rem; }
    .row { display: flex; }
    button { flex: 1; min-height: 48px; margin: 3px; font-size: 1.2rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Calculator</h1>
  <main class="calculator">
    <output id="screen" aria-live="polite">0</output>
    <div class="row"><button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button data-value=" / ">÷</button></div>
    <div class="row"><button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button data-value=" * ">×</button></div>
    <div class="row"><button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button data-value=" - ">−</button></div>
    <div class="row"><button data-value="0">0</button><button data-value=".">.</button><button id="equals">=</button><button data-value=" + ">+</button></div>
    <button id="clear">Clear</button>
  </main>
  <script>
    // 5o-5r: Append button values, calculate on equals, and provide the remaining keys.
    let calculation = "";
    const screen = document.getElementById("screen");

    document.querySelectorAll("[data-value]").forEach((button) => {
      button.addEventListener("click", () => {
        calculation += button.dataset.value;
        screen.textContent = calculation;
        console.log(calculation);
      });
    });

    document.getElementById("equals").addEventListener("click", () => {
      if (!calculation.trim()) return;
      try {
        calculation = String(eval(calculation));
        screen.textContent = calculation;
        console.log(calculation);
      } catch {
        screen.textContent = "Invalid calculation";
        calculation = "";
      }
    });

    document.getElementById("clear").addEventListener("click", () => {
      calculation = "";
      screen.textContent = "0";
    });
  </script>
</body>
</html>
