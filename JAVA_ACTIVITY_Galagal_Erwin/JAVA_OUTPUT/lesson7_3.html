<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson 7 - Length Converter</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    label, input, select, button { margin: 5px; padding: 7px; }
  </style>
</head>
<body>
  <h1>Length Converter</h1>
  <label>Length <input id="length" type="number" value="50"></label>
  <label>From
    <select id="from"><option>miles</option><option>km</option><option>ft</option></select>
  </label>
  <label>To
    <select id="to"><option>km</option><option>miles</option><option>ft</option></select>
  </label>
  <button id="convert">Convert</button>
  <p id="answer" aria-live="polite"></p>
  <script>
    // 7g-7i: Convert miles, kilometers, and feet; report unsupported units.
    const feetPerMile = 5280;
    const feetPerKm = 3281;
    const milesPerKm = 1.6;

    function convertLength(length, from, to) {
      const validUnits = ["km", "miles", "ft"];
      if (!validUnits.includes(from)) return "Invalid unit: " + from;
      if (!validUnits.includes(to)) return "Invalid unit: " + to;
      if (from === to) return length + " " + to;

      let converted;
      if (from === "miles" && to === "km") converted = length * milesPerKm;
      else if (from === "km" && to === "miles") converted = length / milesPerKm;
      else if (from === "miles" && to === "ft") converted = length * feetPerMile;
      else if (from === "km" && to === "ft") converted = length * feetPerKm;
      else if (from === "ft" && to === "miles") converted = length / feetPerMile;
      else if (from === "ft" && to === "km") converted = length / feetPerKm;

      const rounded = Math.round(converted * 100) / 100;
      return rounded + " " + to;
    }

    document.getElementById("convert").addEventListener("click", () => {
      const length = Number(document.getElementById("length").value);
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const result = convertLength(length, from, to);
      document.getElementById("answer").textContent = result;
      console.log(result);
    });

    console.log(convertLength(50, "miles", "km")); // 80 km
    console.log(convertLength(32, "km", "miles")); // 20 miles
    console.log(convertLength(50, "km", "km")); // 50 km
    console.log(convertLength(5, "miles", "ft")); // 26400 ft
    console.log(convertLength(5, "km", "ft")); // 16405 ft
    console.log(convertLength(5, "lbs", "lbs")); // Invalid unit: lbs
  </script>
</body>
</html>
